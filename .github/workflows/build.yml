name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  c89:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Strict C89 check
        shell: pwsh
        run: ./scripts/c89_check.ps1

  dos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DOSBox and 7-Zip
        run: choco install dosbox 7zip --yes --no-progress
      - name: Build for DOS
        shell: pwsh
        run: ./scripts/dos_build.ps1 -Toolchain watcom -Target smoke
      - name: Run on DOS
        shell: pwsh
        run: ./scripts/dos_run.ps1 -Target smoke -Check

  djgpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DOSBox
        run: choco install dosbox --yes --no-progress
      - name: Build for DOS
        shell: pwsh
        run: ./scripts/dos_build.ps1 -Toolchain djgpp -Target smoke
      - name: Run on DOS
        shell: pwsh
        run: ./scripts/dos_run.ps1 -Target smoke -Check
